<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страницата не е намерена | Codem Solution</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF7F1">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Страница с данните на фирмата. Нарочно е отделна: Моньо не ги иска на началната. */
:root{--ink:#0E1B2E;--cream:#FBF7F1;--accent:#FF6B2C;--muted:#5D6779;--line:#E8E0D3}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--cream);color:#16202F;font:17px/1.6 'Onest',-apple-system,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100svh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid rgba(14,27,46,.06)}
.nav{height:70px;display:flex;align-items:center;justify-content:space-between}
.logo{display:block;flex:none;line-height:0}
.logo img{display:block;height:30px;width:auto}
.lang{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:40px;padding:0 12px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);font-family:'Unbounded',sans-serif;font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--ink)}
main{flex:1;padding:64px 0 80px}
h1{font-family:'Unbounded',sans-serif;font-weight:600;font-size:clamp(28px,5vw,44px);letter-spacing:-.02em;line-height:1.1;margin:0;color:var(--ink)}
.lead{color:var(--muted);margin:16px 0 0}
dl{margin:40px 0 0;background:#fff;border:1px solid var(--line);border-radius:22px;padding:8px 28px}
.r{display:grid;grid-template-columns:230px 1fr;gap:6px 24px;padding:18px 0;border-top:1px solid var(--line)}
.r:first-child{border-top:0}
dt{color:var(--muted);font-size:15px}
dd{margin:0;font-weight:600;color:var(--ink)}
dd a:hover{color:var(--accent)}
.back{display:inline-flex;align-items:center;gap:8px;margin-top:34px;font-weight:600;color:var(--ink)}
.back svg{width:18px;height:18px}
.back:hover{color:var(--accent)}
footer{padding:24px 0 30px;font-size:14px;color:var(--muted);border-top:1px solid rgba(14,27,46,.06)}
@media(max-width:600px){.r{grid-template-columns:1fr;gap:2px}main{padding:44px 0 60px}dl{padding:6px 20px}.logo img{height:24px}}
.nf{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}.nf a{display:inline-block;font-family:var(--fd);font-weight:600;font-size:15px;padding:15px 26px;border-radius:999px;background:var(--ink);color:#fff}.nf a + a{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}.en{margin-top:44px;padding-top:28px;border-top:1px solid rgba(14,27,46,.1)}
</style>
</head>
<body>
<header><div class="wrap nav">
  <a href="/" class="logo" aria-label="Codem Solution"><img src="/assets/img/logo.svg" alt="Codem Solution" width="178" height="30"></a>
  <a href="/en/" class="lang" hreflang="en" lang="en" title="English">EN</a>
</div></header>
<main><div class="wrap">
  <h1>Страницата не е намерена</h1>
  <p class="lead">Адресът е грешен или страницата вече не съществува.</p>
  <div class="nf"><a href="/">Към началото</a><a href="/#contact">Контакти</a></div>
  <div class="en" lang="en">
    <p class="lead">This page could not be found. The address is wrong or the page no longer exists.</p>
    <div class="nf"><a href="/en/">Go to the home page</a></div>
  </div>
</div></main>
<footer><div class="wrap">© 2026 Codem Solution</div></footer>
</body>
</html>
